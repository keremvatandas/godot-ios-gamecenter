name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  xcframework:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install SCons
        run: pipx install scons
      - name: Build all artifacts
        run: tools/build_xcframework.sh
      - uses: actions/upload-artifact@v4
        with:
          name: gamecenter-addon
          path: addon/gamecenter/
      - name: Draft release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd addon && zip -r ../gamecenter-addon.zip gamecenter
          cd .. && gh release create "${GITHUB_REF_NAME}" gamecenter-addon.zip --draft --title "${GITHUB_REF_NAME}" --notes "GameCenterKit ${GITHUB_REF_NAME} — copy addon/gamecenter into your project as addons/gamecenter."
