name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  xcframework:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install SCons
        run: pipx install scons
      - name: Build all artifacts
        run: tools/build_xcframework.sh
      - name: Package addon (zip root is addons/, merges straight into a project)
        run: |
          mkdir -p dist/addons
          cp -R example/addons/gamecenter dist/addons/gamecenter
          cp LICENSE dist/addons/gamecenter/LICENSE
          printf '\n----------------------------------------\n\nThe bundled binaries statically link godot-cpp:\n\n' >> dist/addons/gamecenter/LICENSE
          cat godot-cpp/LICENSE.md >> dist/addons/gamecenter/LICENSE
          cd dist && zip -r ../gamecenter-addon.zip addons
      - uses: actions/upload-artifact@v4
        with:
          name: gamecenter-addon
          path: dist/addons/gamecenter/
      - name: Draft release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" gamecenter-addon.zip --draft --title "${GITHUB_REF_NAME}" --notes "GameCenterKit ${GITHUB_REF_NAME} — unzip into your project root; it merges as addons/gamecenter."
